server:
  port: 8080

spring:
  application:
    name: ticketdesk-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  jackson:
    default-property-inclusion: non_null

# Actuator: only /actuator/health is exposed, and it shares the app's own
# port (8080) so the ALB target group only ever needs to know about one
# port and one security group rule.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
