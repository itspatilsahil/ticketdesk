name: Build, test and deploy TicketDesk

on:
  push:
    branches: [main]

# Needed for OIDC (id-token) and for actions/checkout (contents)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: tkt-${{ vars.OWNER_INITIALS }}-api
  ECS_CLUSTER: tkt-${{ vars.OWNER_INITIALS }}-cluster
  ECS_SERVICE: tkt-${{ vars.OWNER_INITIALS }}-svc
  ECS_TASK_FAMILY: tkt-${{ vars.OWNER_INITIALS }}-api-task
  CONTAINER_NAME: api

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the current diff

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A failing test here stops the workflow entirely - the deploy job
      # below has `needs: build-test-scan` and never runs.
      - name: Run unit tests
        working-directory: backend
        run: mvn -B test

      # Blocks the deploy if a credential was ever committed - checklist
      # item 26 / pass-fail gate 1, enforced by the pipeline, not just by
      # a human remembering to check.
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image
        id: build
        working-directory: backend
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          SHA=$(git rev-parse --short HEAD)
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-test-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' > current-task-def.json

      - name: Render new task definition with the freshly built image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: current-task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build-test-scan.outputs.image }}

      - name: Deploy to ECS and wait for stability
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Hit the deployed URL and check for a healthy response
        run: |
          URL="${{ vars.APP_URL }}"
          echo "Smoke testing $URL"

          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "$URL/actuator/health")
          if [ "$HEALTH" != "200" ]; then
            echo "Health check failed with status $HEALTH"
            exit 1
          fi

          CREATE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/tickets" \
            -H "Content-Type: application/json" \
            -d '{"title":"CI smoke test","description":"created by the pipeline","category":"SOFTWARE","priority":"LOW"}')
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "Create-ticket smoke check failed with status $CREATE_STATUS"
            exit 1
          fi

          echo "Smoke test passed."
